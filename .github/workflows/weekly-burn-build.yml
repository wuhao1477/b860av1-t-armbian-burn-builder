name: Weekly B860 burn image

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the public input fingerprint is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 直刷包的输入冻结在实机验证过的那一份 raw release，不再自己漂到「最新的 armbian-*」。
  # 改下面三个值就是解冻；它们进 recipe_digest，所以改完下一次运行必然重建。
  # 冻结集合、证据和解冻步骤见 docs/frozen-inputs.md。
  # 输入自托管：这份 raw release 早期由另一个仓库托管，那条线已经合并进本仓库、
  # 原仓库转为私有；资产逐字节镜像到本仓库的 input-* release，所以 SOURCE_DIGEST 不变。
  SOURCE_REPOSITORY: wuhao1477/b860av1-t-armbian-burn-builder
  SOURCE_RELEASE: input-armbian-26.11.0-debian-13.6-trixie-k5.10.268-build-46.1
  SOURCE_ASSET: Armbian_26.11.0_amlogic_b860av1-t_trixie_5.10.268_server_2026.08.31.img.gz
  SOURCE_DIGEST: 32f5b8079e6c5ff8642e0703cfc0a8ae4402b1057b46bb3b8ce7181283da6ace

concurrency:
  group: b860-burn-weekly
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      asset_url: ${{ steps.resolve.outputs.asset_url }}
      asset_name: ${{ steps.resolve.outputs.asset_name }}
      asset_digest: ${{ steps.resolve.outputs.asset_digest }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -Eeuo pipefail
          release_tag=$SOURCE_RELEASE
          current=$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$release_tag")
          jq -e '.draft == false' <<<"$current" >/dev/null \
            || { echo "frozen source release is a draft: $release_tag" >&2; exit 1; }
          asset=$(jq -c --arg name "$SOURCE_ASSET" '[.assets[] | select(.name == $name)] | first // empty' <<<"$current")
          [[ -n "$asset" ]] || {
            echo "frozen source asset is missing from $release_tag: $SOURCE_ASSET" >&2
            echo 'see docs/frozen-inputs.md before repinning' >&2
            exit 1
          }
          asset_name=$(jq -r '.name' <<<"$asset")
          asset_url=$(jq -r '.browser_download_url' <<<"$asset")
          asset_digest=$(jq -r '.digest // ""' <<<"$asset" | sed 's/^sha256://')
          [[ "$asset_digest" == "$SOURCE_DIGEST" ]] || {
            echo "frozen source asset digest changed: expected $SOURCE_DIGEST, got $asset_digest" >&2
            exit 1
          }
          recipe_digest=$(sha256sum \
            .github/workflows/weekly-burn-build.yml \
            board-inputs/DDR.USB board-inputs/UBOOT.USB board-inputs/aml_sdc_burn.UBOOT \
            board-inputs/aml_sdc_burn.ini board-inputs/platform.conf board-inputs/bootloader.PARTITION \
            board-inputs/logo.PARTITION board-inputs/meson1.dtb \
            config/board.json config/burn-inputs.json config/burn-tooling.json \
            config/mainline-boot.json board-overlays/burn-partitions.dtso \
            scripts/build-burn-payloads.sh scripts/build-vendor-boot-burn.sh \
            scripts/validate-vendor-boot-burn.sh scripts/setup-image-tools.sh \
            scripts/apply-rootfs-defaults.sh scripts/fetch-vdec-firmware.sh \
            scripts/build-hcodec-module.sh config/sources.json \
            tools/hcenc/fetch-vendor.sh tools/hcodec-mod/meson_hcodec.c \
            tools/hcodec-mod/kmshim.h tools/hcodec-mod/Makefile \
            scripts/burn-image.mjs scripts/mainline-boot.mjs \
            src/android-sparse.mjs src/burn-dtb-roles.mjs src/emmc-boot-chain.mjs \
            | sha256sum | awk '{print $1}')
          fingerprint=$(printf '%s\n%s\n%s\n%s\n' "$release_tag" "$asset_name" "$asset_digest" "$recipe_digest" | sha256sum | awk '{print $1}')
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == true and (.tagName | startswith("b860-burn-")))] | first | .tagName // empty')
          old=''
          if [[ -n "$previous" ]]; then old=$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | sed -n 's/^Input fingerprint: //p' | head -n1); fi
          changed=true
          [[ "$FORCE" == true || "$fingerprint" != "$old" ]] || changed=false
          {
            echo "changed=$changed"
            echo "asset_url=$asset_url"
            echo "asset_name=$asset_name"
            echo "asset_digest=$asset_digest"
            echo "release_tag=$release_tag"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl device-tree-compiler dosfstools e2fsprogs file gcc-aarch64-linux-gnu git gzip kmod kpartx libgnutls28-dev mtools u-boot-tools util-linux xz-utils
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Build pinned ampack and gxlimg
        run: |
          set -Eeuo pipefail
          scripts/setup-image-tools.sh >/dev/null
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Download and validate public Armbian release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.detect.outputs.asset_digest }}
          NAME: ${{ needs.detect.outputs.asset_name }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir source-assets
          gh release download "$PUBLIC_RELEASE" --repo "$SOURCE_REPOSITORY" --dir source-assets
          printf '%s  %s\n' "$DIGEST" "source-assets/$NAME" | sha256sum --check --status
          manifest_fingerprint=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).fingerprint)' source-assets/resolved-sources.json)
          node scripts/validate-candidate-artifacts.mjs source-assets "$manifest_fingerprint"
      - name: Build boot and rootfs payloads
        run: scripts/build-burn-payloads.sh "source-assets/${{ needs.detect.outputs.asset_name }}" payloads
      - name: Build vendor-bootloader burn image
        run: scripts/build-vendor-boot-burn.sh payloads out
      - name: Independently validate container
        run: scripts/validate-vendor-boot-burn.sh out/burn.img out/vendor-boot-contract.json
      - name: Create and verify xz download asset
        run: |
          set -Eeuo pipefail
          xz -T0 -6e --check=sha256 --stdout out/burn.img > out/burn.img.xz
          xz -t out/burn.img.xz
          original=$(sha256sum out/burn.img | awk '{print $1}')
          expanded=$(xz --decompress --stdout out/burn.img.xz | sha256sum | awk '{print $1}')
          [[ "$expanded" == "$original" ]] || { echo 'xz expansion digest differs from burn.img' >&2; exit 1; }
      - name: Write release metadata
        env:
          INPUT_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          # 这是每周自动构建的 prerelease：策略与实机验证过的那份完全相同，但字节流本身
          # 没上过机。落到这一页的人应该知道还有一份逐字节验证过的包可以下。
          printf 'Input fingerprint: %s\nPublic release: %s\nStrategy: vendor-fip-vendor-bl33-android-boot\nStatus: format-valid / strategy hardware-verified 2026-09-03\n\n这是每周自动构建的 prerelease —— 构建策略与实机验证过的那份一致，但**这一份字节流本身没有上机测试过**。\n想要逐字节验证过的包，请下 [latest release](https://github.com/%s/releases/latest)。\n\n上游输入已冻结在 `%s`，解冻步骤见 [docs/frozen-inputs.md](https://github.com/%s/blob/main/docs/frozen-inputs.md)。\nBurning Tool 里必须勾「擦除 flash」和「擦除 bootloader」；刷机步骤与设计说明见 [docs/burn-image.md](https://github.com/%s/blob/main/docs/burn-image.md)。\n' \
            "$INPUT_FINGERPRINT" "$PUBLIC_RELEASE" "$GITHUB_REPOSITORY" "$SOURCE_RELEASE" \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > out/RELEASE.md
          (cd out && sha256sum burn.img burn.img.xz vendor-boot-contract.json burn-dtb-contract.json RELEASE.md > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b860-burn-output
          path: |
            out/burn.img
            out/burn.img.xz
            out/SHA256SUMS
            out/vendor-boot-contract.json
            out/burn-dtb-contract.json
            out/RELEASE.md
          retention-days: 1

  publish:
    needs: [detect, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: b860-burn-output
          path: out
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
        run: |
          set -Eeuo pipefail
          tag="b860-burn-${PUBLIC_RELEASE#Armbian_}-build-${RUN_NUMBER}.${RUN_ATTEMPT}"
          assets=(
            out/burn.img
            out/burn.img.xz
            out/SHA256SUMS
            out/vendor-boot-contract.json
            out/burn-dtb-contract.json
            out/RELEASE.md
          )
          draft_release_ready() {
            [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv' 2>/dev/null || true)" == $'true\ttrue' ]]
          }
          release_ready=false
          for attempt in 1 2 3 4 5; do
            if draft_release_ready; then
              release_ready=true
              break
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$tag" --notes-file out/RELEASE.md || true
            if draft_release_ready; then
              release_ready=true
              break
            fi
            sleep $((attempt * 10))
          done
          [[ "$release_ready" == true ]] || { echo 'draft release is unavailable' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 10))
            done
            [[ "$uploaded" == true ]] || { echo "failed to upload $asset" >&2; exit 1; }
          done
          remote_asset_matches() {
            local asset=$1 name local_size local_digest matches remote_size remote_digest
            name=$(basename -- "$asset")
            local_size=$(stat --format='%s' "$asset")
            local_digest=$(sha256sum "$asset" | awk '{print $1}')
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease \
              > out/release-assets.json
            jq -e '.isDraft == true and .isPrerelease == true' out/release-assets.json >/dev/null
            matches=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' out/release-assets.json)
            [[ "$(jq 'length' <<<"$matches")" -eq 1 ]] || return 1
            remote_size=$(jq -r '.[0].size' <<<"$matches")
            remote_digest=$(jq -r '.[0].digest // ""' <<<"$matches")
            [[ "$remote_size" == "$local_size" && "$remote_digest" == "sha256:$local_digest" ]]
          }
          for asset in "${assets[@]}"; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if remote_asset_matches "$asset"; then
                verified=true
                break
              fi
              sleep $((attempt * 10))
            done
            [[ "$verified" == true ]] || { echo "server asset differs from $asset" >&2; exit 1; }
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
