name: Weekly B860 burn image

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the public input fingerprint is unchanged
        required: false
        type: boolean
        default: false
      diagnostic_console:
        description: 'Diagnostic only: also log the stock kernel to HDMI (tty0), not just serial'
        required: false
        type: boolean
        default: false
      diagnostic_variant:
        description: 'Diagnostic package variant (stock-control keeps boot.PARTITION byte-identical)'
        required: false
        type: choice
        default: console-beacon
        options:
          - console-beacon
          - stock-control
          - stock-env-reset

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: ophub/amlogic-s9xxx-armbian
  # ophub 未发布 s905mb 资产；s905mb 与 s905lb 在 ophub 设备库中共用
  # meson-gxl-s905x-p212.dtb 与 u-boot-r3300l.bin，故 S905M-B 取 s905lb-r3300l。
  SOURCE_BOARD: s905lb-r3300l
  SOURCE_SUITE: trixie
  SOURCE_KERNEL_SERIES: '6.12'

concurrency:
  group: b860-burn-weekly
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      asset_url: ${{ steps.resolve.outputs.asset_url }}
      asset_name: ${{ steps.resolve.outputs.asset_name }}
      asset_digest: ${{ steps.resolve.outputs.asset_digest }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -Eeuo pipefail
          tag_prefix="Armbian_${SOURCE_SUITE}_arm64_server_"
          asset_pattern="^Armbian_.*_amlogic_${SOURCE_BOARD}_${SOURCE_SUITE}_${SOURCE_KERNEL_SERIES//./\\.}\\.[0-9]+_server_.*\\.img\\.gz$"
          current=$(gh api "repos/$SOURCE_REPOSITORY/releases" --paginate --jq \
            "[.[] | select(.draft == false and (.tag_name | startswith(\"$tag_prefix\")) and (.assets | length > 0))] | sort_by(.published_at) | reverse | .[0]")
          [[ -n "$current" && "$current" != null ]] || { echo "no ophub release matches $tag_prefix" >&2; exit 1; }
          release_tag=$(jq -r '.tag_name' <<<"$current")
          # 同一 release 内可能并存多个补丁版内核，按资产名倒序取最高的 6.12.x
          asset=$(jq -c --arg pattern "$asset_pattern" \
            '[.assets[] | select(.name | test($pattern))] | sort_by(.name) | reverse | .[0]' <<<"$current")
          [[ "$asset" != null ]] || { echo "ophub release $release_tag has no $SOURCE_BOARD $SOURCE_KERNEL_SERIES image" >&2; exit 1; }
          asset_name=$(jq -r '.name' <<<"$asset")
          asset_url=$(jq -r '.browser_download_url' <<<"$asset")
          asset_digest=$(jq -r '.digest' <<<"$asset" | sed 's/^sha256://')
          [[ "$asset_digest" =~ ^[0-9a-f]{64}$ ]] || { echo 'public asset has no sha256 digest' >&2; exit 1; }
          recipe_digest=$(sha256sum \
            .github/workflows/weekly-burn-build.yml \
            board-inputs/DDR.USB board-inputs/UBOOT.USB board-inputs/aml_sdc_burn.UBOOT \
            board-inputs/aml_sdc_burn.ini board-inputs/platform.conf board-inputs/bootloader.PARTITION \
            board-inputs/meson1.dtb board-overlays/burn-partitions.dtso \
            config/board.json config/burn-inputs.json config/burn-tooling.json \
            scripts/build-burn-image.sh scripts/burn-image.mjs \
            scripts/build-board-dtb.sh scripts/validate-dtb-compatible.mjs \
            scripts/validate-burn-image.sh src/android-sparse.mjs src/burn-report.mjs \
            src/burn-dtb-roles.mjs src/burn-standalone-dtb.mjs \
            src/direct-boot-contract.mjs src/emmc-boot-chain.mjs \
            | sha256sum | awk '{print $1}')
          fingerprint=$(printf '%s\n%s\n%s\n%s\n' "$release_tag" "$asset_name" "$asset_digest" "$recipe_digest" | sha256sum | awk '{print $1}')
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == true and (.tagName | startswith("b860-burn-")))] | first | .tagName // empty')
          old=''
          if [[ -n "$previous" ]]; then old=$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | sed -n 's/^Input fingerprint: //p' | head -n1); fi
          changed=true
          [[ "$FORCE" == true || "$fingerprint" != "$old" ]] || changed=false
          {
            echo "changed=$changed"
            echo "asset_url=$asset_url"
            echo "asset_name=$asset_name"
            echo "asset_digest=$asset_digest"
            echo "release_tag=$release_tag"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl device-tree-compiler e2fsprogs file git gzip kpartx mtools u-boot-tools util-linux xz-utils
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Download and validate ophub Armbian release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.detect.outputs.asset_digest }}
          NAME: ${{ needs.detect.outputs.asset_name }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir source-assets
          # ophub 的 release 含 200+ 个板型资产，必须按名下载单个文件
          gh release download "$PUBLIC_RELEASE" --repo "$SOURCE_REPOSITORY" \
            --pattern "$NAME" --dir source-assets
          [[ -f "source-assets/$NAME" ]] || { echo "ophub asset was not downloaded: $NAME" >&2; exit 1; }
          printf '%s  %s\n' "$DIGEST" "source-assets/$NAME" | sha256sum --check --status
          gzip -t "source-assets/$NAME"
      - name: Build Amlogic v2 burn image
        run: scripts/build-burn-image.sh "source-assets/${{ needs.detect.outputs.asset_name }}" out
      - name: Independently validate container
        run: scripts/validate-burn-image.sh out/burn.img out/burn-report.json "source-assets/${{ needs.detect.outputs.asset_name }}"
      - name: Create and verify xz download asset
        run: |
          set -Eeuo pipefail
          xz -T0 -6e --check=sha256 --stdout out/burn.img > out/burn.img.xz
          xz -t out/burn.img.xz
          original=$(sha256sum out/burn.img | awk '{print $1}')
          expanded=$(xz --decompress --stdout out/burn.img.xz | sha256sum | awk '{print $1}')
          [[ "$expanded" == "$original" ]] || { echo 'xz expansion digest differs from burn.img' >&2; exit 1; }
      - name: Write release metadata
        env:
          INPUT_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
          ASSET_NAME: ${{ needs.detect.outputs.asset_name }}
        run: |
          set -Eeuo pipefail
          {
            printf 'Board: ZTE ZXV10 B860AV1.1-T (Amlogic S905M-B, meson-gxl, eMMC)\n'
            printf 'Upstream: %s / %s\n' "$SOURCE_REPOSITORY" "$PUBLIC_RELEASE"
            printf 'Upstream asset: %s\n' "$ASSET_NAME"
            printf 'Boot chain: stock signed BL2/BL30/BL301/BL31/BL33 -> Android boot v0 -> Armbian kernel\n'
            printf 'Input fingerprint: %s\n' "$INPUT_FINGERPRINT"
            printf 'Status: format-valid / hardware-unverified\n'
            printf 'The stock bootloader is preserved byte-for-byte; only boot and data payloads are rewritten.\n'
          } > out/RELEASE.md
          (cd out && sha256sum burn.img burn.img.xz stock-bootloader-contract.json boot-contract.json dtb-contract.json rootfs-contract.json burn-report.json source-built-dtb.json device-tree-source.dts RELEASE.md > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b860-burn-output
          path: |
            out/burn.img
            out/burn.img.xz
            out/SHA256SUMS
            out/stock-bootloader-contract.json
            out/boot-contract.json
            out/dtb-contract.json
            out/rootfs-contract.json
            out/burn-report.json
            out/source-built-dtb.json
            out/device-tree-source.dts
            out/RELEASE.md
          retention-days: 1

  publish:
    needs: [detect, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: b860-burn-output
          path: out
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE: ${{ needs.detect.outputs.release_tag }}
          ASSET_NAME: ${{ needs.detect.outputs.asset_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
        run: |
          set -Eeuo pipefail
          # ophub 的 release tag 只含代号和月份，Armbian 与内核版本都在资产名里。
          # 形如 Armbian_26.08.0_amlogic_s905lb-r3300l_trixie_6.12.100_server_2026.08.01.img.gz
          [[ "$ASSET_NAME" =~ ^Armbian_([0-9][^_]*)_amlogic_[^_]+_([a-z]+)_([0-9]+\.[0-9]+\.[0-9]+)_ ]] || {
            echo "cannot derive a version tag from the ophub asset name: $ASSET_NAME" >&2
            exit 1
          }
          tag="b860-burn-armbian-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-k${BASH_REMATCH[3]}-build-${RUN_NUMBER}.${RUN_ATTEMPT}"
          assets=(
            out/burn.img
            out/burn.img.xz
            out/SHA256SUMS
            out/stock-bootloader-contract.json
            out/boot-contract.json
            out/dtb-contract.json
            out/rootfs-contract.json
            out/burn-report.json
            out/source-built-dtb.json
            out/device-tree-source.dts
            out/RELEASE.md
          )
          draft_release_ready() {
            [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv' 2>/dev/null || true)" == $'true\ttrue' ]]
          }
          release_ready=false
          for attempt in 1 2 3 4 5; do
            if draft_release_ready; then
              release_ready=true
              break
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$tag" --notes-file out/RELEASE.md || true
            if draft_release_ready; then
              release_ready=true
              break
            fi
            sleep $((attempt * 10))
          done
          [[ "$release_ready" == true ]] || { echo 'draft release is unavailable' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 10))
            done
            [[ "$uploaded" == true ]] || { echo "failed to upload $asset" >&2; exit 1; }
          done
          remote_asset_matches() {
            local asset=$1 name local_size local_digest matches remote_size remote_digest
            name=$(basename -- "$asset")
            local_size=$(stat --format='%s' "$asset")
            local_digest=$(sha256sum "$asset" | awk '{print $1}')
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease \
              > out/release-assets.json
            jq -e '.isDraft == true and .isPrerelease == true' out/release-assets.json >/dev/null
            matches=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' out/release-assets.json)
            [[ "$(jq 'length' <<<"$matches")" -eq 1 ]] || return 1
            remote_size=$(jq -r '.[0].size' <<<"$matches")
            remote_digest=$(jq -r '.[0].digest // ""' <<<"$matches")
            [[ "$remote_size" == "$local_size" && "$remote_digest" == "sha256:$local_digest" ]]
          }
          for asset in "${assets[@]}"; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if remote_asset_matches "$asset"; then
                verified=true
                break
              fi
              sleep $((attempt * 10))
            done
            [[ "$verified" == true ]] || { echo "server asset differs from $asset" >&2; exit 1; }
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  stock_diagnostic_build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      B860_DIAGNOSTIC_CONSOLE: ${{ inputs.diagnostic_console && 1 || 0 }}
      B860_DIAGNOSTIC_VARIANT: ${{ inputs.diagnostic_variant || 'console-beacon' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install diagnostic build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cpio file \
            gcc-aarch64-linux-gnu git gzip libc6-dev-arm64-cross qemu-user-static xz-utils
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Build and inspect ARM64 diagnostic initramfs
        run: scripts/build-stock-diagnostic-initramfs.sh out
      - name: Build Amlogic stock-kernel diagnostic image
        run: scripts/build-stock-diagnostic-burn.sh out/diagnostic-initramfs.cpio.gz out
      - name: Independently unpack and validate diagnostic image
        run: scripts/validate-stock-diagnostic-burn.sh out/burn.img out/diagnostic-initramfs.cpio.gz
      - name: Create and verify xz diagnostic asset
        run: |
          set -Eeuo pipefail
          xz -T0 -6e --check=sha256 --stdout out/burn.img > out/burn.img.xz
          xz -t out/burn.img.xz
          original=$(sha256sum out/burn.img | awk '{print $1}')
          expanded=$(xz --decompress --stdout out/burn.img.xz | sha256sum | awk '{print $1}')
          [[ "$expanded" == "$original" ]] || { echo 'xz expansion digest differs from burn.img' >&2; exit 1; }
      - name: Write diagnostic release metadata
        run: |
          set -Eeuo pipefail
          {
            echo 'Purpose: stock-kernel diagnostic'
            echo 'Status: format-valid / diagnostic / hardware-unverified'
            echo 'This is not Debian or Armbian. It preserves the stock Linux 3.14 kernel and multi-DTB.'
            echo 'Only the stock Android ramdisk is replaced by a minimal BusyBox HTTP-only initramfs.'
            echo 'This stage intentionally contains no SSH server so the ramdisk remains smaller than stock.'
            echo 'DHCP hostname: b860-diag; HTTP status path: /index.txt.'
            echo 'DHCP fallback: 169.254.86.10/16; HTTP status port: 80.'
            echo 'The stock Android splash is intentional and only proves that stock U-Boot reached preboot.'
            if [[ "$B860_DIAGNOSTIC_VARIANT" == stock-env-reset ]]; then
              echo 'Variant: stock-env-reset. boot.PARTITION is a byte-identical stock copy and'
              echo 'env.PARTITION restores the stock environment snapshot verbatim. The control'
              echo 'experiment already proved boot.PARTITION content is irrelevant to the symptom,'
              echo 'so the remaining suspect is upgrade_step being parked at 3, which makes the'
              echo 'stock upgrade_check run update on every boot and never reach storeboot.'
            elif [[ "$B860_DIAGNOSTIC_VARIANT" == stock-control ]]; then
              echo 'Variant: stock-control. boot.PARTITION is a byte-identical copy of the stock'
              echo 'image; no ramdisk and no command line were changed. This is the control for'
              echo 'the experiment that separates "repacked boot is rejected" from "the boot'
              echo 'partition is never read at all". Booting into Android means the boot chain and'
              echo 'packaging are fine and the fault is in repacking; stopping at the same splash'
              echo 'means boot.PARTITION content is irrelevant to the symptom.'
            elif [[ "$B860_DIAGNOSTIC_CONSOLE" == 1 ]]; then
              echo 'Variant: console-beacon with HDMI logging. The Android boot command line field'
              echo 'carries console=tty0 and ignore_loglevel. A background process blinks the whole'
              echo 'framebuffer; the flash count per group is the stage reached. A frozen screen'
              echo 'means the kernel never got that far. See consoleCmdline in'
              echo 'diagnostic-boot-contract.json for the exact bytes.'
            else
              echo 'Variant: console-beacon. Only the ramdisk differs from stock; kernel logs to serial only.'
            fi
          } > out/RELEASE.md
          (cd out && sha256sum burn.img burn.img.xz diagnostic-initramfs.cpio.gz \
            diagnostic-inputs-contract.json diagnostic-initramfs-contract.json \
            diagnostic-boot-contract.json stock-bootloader-contract.json \
            stock-env-contract.json RELEASE.md \
            > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b860-stock-kernel-diagnostic-output
          path: |
            out/burn.img
            out/burn.img.xz
            out/diagnostic-initramfs.cpio.gz
            out/diagnostic-inputs-contract.json
            out/diagnostic-initramfs-contract.json
            out/diagnostic-boot-contract.json
            out/stock-bootloader-contract.json
            out/stock-env-contract.json
            out/SHA256SUMS
            out/RELEASE.md
          retention-days: 1

  stock_diagnostic_publish:
    needs: stock_diagnostic_build
    if: ${{ needs.stock_diagnostic_build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: b860-stock-kernel-diagnostic-output
          path: out
      - name: Publish stock-kernel diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          tag="b860-stock-kernel-diagnostic-build-${RUN_NUMBER}.${RUN_ATTEMPT}"
          assets=(
            out/burn.img
            out/burn.img.xz
            out/diagnostic-initramfs.cpio.gz
            out/diagnostic-inputs-contract.json
            out/diagnostic-initramfs-contract.json
            out/diagnostic-boot-contract.json
            out/stock-bootloader-contract.json
            out/stock-env-contract.json
            out/SHA256SUMS
            out/RELEASE.md
          )
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "$tag" --notes-file out/RELEASE.md
          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
          done
          for asset in "${assets[@]}"; do
            name=$(basename -- "$asset")
            local_size=$(stat --format='%s' "$asset")
            local_digest=$(sha256sum "$asset" | awk '{print $1}')
            remote=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | [.size,.digest] | @tsv")
            [[ "$remote" == "$local_size"$'\t'"sha256:$local_digest" ]] || {
              echo "server asset differs from $asset" >&2
              exit 1
            }
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
