name: Validate device evidence

on:
  pull_request:
    paths:
      - 'evidence/**'
      - '!evidence/.gitkeep'

permissions:
  contents: read

jobs:
  validate:
    name: Read-only evidence validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install --yes gh
      - name: Download exact Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          evidence_json=$(find evidence -type f -name device-validation.json -print -quit)
          [[ -n "$evidence_json" ]] || { echo 'no device-validation.json found' >&2; exit 1; }
          evidence_dir=$(dirname "$evidence_json")
          release_tag=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1])).release.tag)" "$evidence_json")
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release view "$release_tag" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release-assets/release.json"
          for asset in SHA256SUMS build-input-heads.json release-tag.txt resolved-sources.json validation-report.json filesystem-manifest.sha256 boot-components.json; do
            gh release download "$release_tag" --pattern "$asset" --dir "$RUNNER_TEMP/release-assets"
          done
          printf '%s\n' "$evidence_dir" > "$RUNNER_TEMP/evidence-path"
      - name: Validate evidence without publication
        run: |
          set -Eeuo pipefail
          evidence_dir=$(cat "$RUNNER_TEMP/evidence-path")
          node scripts/validate-device-evidence.mjs \
            "$evidence_dir" "$RUNNER_TEMP/release-assets" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/device-validation-summary.json"
      - name: Upload short validation summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: device-evidence-pr-summary
          path: ${{ runner.temp }}/device-validation-summary.json
          if-no-files-found: error
          retention-days: 3
